[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-sim-cd"
version = "0.1.0"
description = "Reproducible student code revision simulation with contrastive scoring"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
inference = [
  "torch==2.6.0",
  "transformers==4.51.3",
  "safetensors>=0.4.3,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
